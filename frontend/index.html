<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Twin AI Flood Risk</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      body { margin: 0; font-family: Arial, sans-serif; }
      #map { height: 80vh; }
      .panel { padding: 12px; }
      input { margin-right: 8px; }
      #result { margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="panel">
      <input id="lat" placeholder="Latitude" />
      <input id="lon" placeholder="Longitude" />
      <button onclick="queryPoint()">Predict Point Risk</button>
      <button onclick="downloadRiskMap()">Download Risk Map</button>
      <div id="result"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const API_BASE = "http://localhost:8000";
      const map = L.map("map").setView([23.5, 90.3], 8);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      let marker = null;

      async function fetchPoint(lat, lon) {
        const response = await fetch(`${API_BASE}/predict/point?lat=${lat}&lon=${lon}`);
        if (!response.ok) throw new Error(await response.text());
        return response.json();
      }

      async function queryPoint() {
        const lat = document.getElementById("lat").value;
        const lon = document.getElementById("lon").value;
        const data = await fetchPoint(lat, lon);
        document.getElementById("result").innerText = JSON.stringify(data, null, 2);
      }

      async function downloadRiskMap() {
        window.open(`${API_BASE}/predict/risk-map`, "_blank");
      }

      map.on("click", async (e) => {
        const { lat, lng } = e.latlng;
        document.getElementById("lat").value = lat.toFixed(6);
        document.getElementById("lon").value = lng.toFixed(6);
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map);
        const data = await fetchPoint(lat, lng);
        marker.bindPopup(`Flood risk: ${(data.risk_probability * 100).toFixed(2)}%`).openPopup();
        document.getElementById("result").innerText = JSON.stringify(data, null, 2);
      });
    </script>
  </body>
</html>
